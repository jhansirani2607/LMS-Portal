<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" role="img" aria-label="AVM Smart Solutions">
  <defs>
    <linearGradient id="avmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="avmText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <g>
    <!-- Hexagon mark -->
    <path d="M28 4 L48 15 L48 37 L28 48 L8 37 L8 15 Z" fill="none" stroke="url(#avmGrad)" stroke-width="2.5"/>
