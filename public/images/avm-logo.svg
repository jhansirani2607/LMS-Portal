    <circle cx="8" cy="15" r="2" fill="#a855f7"/>
    <circle cx="48" cy="37" r="2" fill="#6366f1"/>
  </g>
  <!-- Wordmark -->
  <text x="62" y="26" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="url(#avmText)">AVM Smart</text>
  <text x="62" y="44" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" letter-spacing="3">SOLUTIONS</text>
